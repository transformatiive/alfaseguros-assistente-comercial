openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Alfaseguros Supervisor Virtual — daily AI analysis of phone conversations
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: runs
    description: Analysis run operations
  - name: conversations
    description: Conversation operations
  - name: summary
    description: Daily summary operations
  - name: operators
    description: Operator coaching operations

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /run:
    post:
      operationId: triggerRun
      tags: [runs]
      summary: Trigger analysis for a date
      description: Starts a new analysis run for the given date. Returns immediately; use GET /run/{date} to poll status.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TriggerRunBody"
      responses:
        "202":
          description: Run accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Run already in progress for this date
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /run/{date}:
    get:
      operationId: getRunStatus
      tags: [runs]
      summary: Get run status for a date
      description: Returns the status of the analysis run for the given date (YYYY-MM-DD).
      parameters:
        - name: date
          in: path
          required: true
          schema:
            type: string
            description: Date in YYYY-MM-DD format
      responses:
        "200":
          description: Run status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "404":
          description: No run found for this date
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /summary/{date}:
    get:
      operationId: getDailySummary
      tags: [summary]
      summary: Get daily executive summary
      description: Returns the AI-generated executive summary for the given date (YYYY-MM-DD).
      parameters:
        - name: date
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Daily summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DailySummary"
        "404":
          description: No summary found for this date
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /conversations/{date}:
    get:
      operationId: listConversations
      tags: [conversations]
      summary: List conversations for a date
      description: Returns a list of all analyzed conversations for the given date (YYYY-MM-DD).
      parameters:
        - name: date
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of conversations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ConversationSummary"
        "404":
          description: No conversations found for this date
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /conversations/{date}/{conversationId}:
    get:
      operationId: getConversation
      tags: [conversations]
      summary: Get a single conversation with full analysis
      parameters:
        - name: date
          in: path
          required: true
          schema:
            type: string
        - name: conversationId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Conversation detail with full analysis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationDetail"
        "404":
          description: Conversation not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /operators/{date}:
    get:
      operationId: listOperatorSummaries
      tags: [operators]
      summary: Get per-operator coaching summaries for a date
      parameters:
        - name: date
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of operator coaching summaries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OperatorSummary"
        "404":
          description: No operator summaries found for this date
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    TriggerRunBody:
      type: object
      properties:
        date:
          type: string
          description: Date to analyze in YYYY-MM-DD format
        force:
          type: boolean
          description: If true, re-analyze conversations that already have analysis
      required:
        - date

    Run:
      type: object
      properties:
        id:
          type: integer
        date:
          type: string
        status:
          type: string
          enum: [pending, running, completed, failed]
        totalConversations:
          type: ["integer", "null"]
        analyzedConversations:
          type: ["integer", "null"]
        totalCostUsd:
          type: ["number", "null"]
        errorMessage:
          type: ["string", "null"]
        createdAt:
          type: string
        updatedAt:
          type: string
      required:
        - id
        - date
        - status
        - totalConversations
        - analyzedConversations
        - totalCostUsd
        - errorMessage
        - createdAt
        - updatedAt

    ConversationSummary:
      type: object
      properties:
        id:
          type: integer
        runDate:
          type: string
        customerPhone:
          type: string
        callCount:
          type: integer
        agentId:
          type: ["string", "null"]
        agentName:
          type: ["string", "null"]
        durationSec:
          type: ["integer", "null"]
        isMultiLeg:
          type: boolean
        hasAnalysis:
          type: boolean
        # Analysis-derived fields surfaced to the list view (null when no analysis yet)
        categoria:
          type: ["string", "null"]
        produto:
          type: ["string", "null"]
        qualidadeGlobal:
          type: ["integer", "null"]
        riscoPerdaLead:
          type: ["string", "null"]
          enum: [baixo, medio, alto, null]
        desviosCount:
          type: integer
        followUpNecessario:
          type: boolean
        startTime:
          type: ["string", "null"]
        costUsd:
          type: ["number", "null"]
        createdAt:
          type: string
      required:
        - id
        - runDate
        - customerPhone
        - callCount
        - agentId
        - agentName
        - durationSec
        - isMultiLeg
        - hasAnalysis
        - categoria
        - produto
        - qualidadeGlobal
        - riscoPerdaLead
        - desviosCount
        - followUpNecessario
        - startTime
        - costUsd
        - createdAt

    DesvioProcedimento:
      type: object
      description: A specific deviation from expected procedure observed in the conversation.
      properties:
        severidade:
          type: string
          enum: [alta, media, baixa]
        titulo:
          type: string
          description: Short label, e.g. "Sem confirmação de identidade"
        detalhe:
          type: string
          description: Concrete description of what was missed and why it matters
        chamadaEspecifica:
          type: ["string", "null"]
          description: Reference to a specific leg/time, e.g. "16:06 (chamada 1)"
      required:
        - severidade
        - titulo
        - detalhe
        - chamadaEspecifica

    ConversationAnalysis:
      type: object
      description: Per-conversation analysis (canonical schema — EU-PT field names per HANDOVER §2)
      properties:
        categoria:
          type: string
          description: e.g. Cotação, Renovação, Sinistro, Informação, Pós-venda
        produto:
          type: string
          description: e.g. TVDE, Multirriscos, Auto, Saúde, Condomínio, Empresas
        narrativaConversa:
          type: string
          description: End-to-end story of the customer's request across all legs
        arcoConversa:
          type: string
          description: Short phrase describing the arc, e.g. "Frio→Quente", "Estagnado", "Direto ao Fecho", "Esfriou"
        sentimentoClienteEvolucao:
          type: string
          description: Evolution of customer sentiment across legs (rendered in italic)
        qualidadeGlobal:
          type: integer
          minimum: 1
          maximum: 5
          description: Overall quality stars (1-5)
        continuidade:
          type: string
          description: Continuity assessment — empty if single-leg, warning text if handoffs failed
        desviosProcedimento:
          type: array
          items:
            $ref: "#/components/schemas/DesvioProcedimento"
        pontosPositivos:
          type: array
          items:
            type: string
        feedbackSupervisor:
          type: string
          description: Coaching message addressed to the operator by name (EU-PT, coaching tone)
        sugestaoEspecialista:
          type: string
          description: Cross-sell / product-expertise suggestion
        followUpNecessario:
          type: boolean
        followUpDescricao:
          type: string
          description: What to do and by when (empty when followUpNecessario is false)
        riscoPerdaLead:
          type: string
          enum: [baixo, medio, alto]
        tags:
          type: array
          items:
            type: string
      required:
        - categoria
        - produto
        - narrativaConversa
        - arcoConversa
        - sentimentoClienteEvolucao
        - qualidadeGlobal
        - continuidade
        - desviosProcedimento
        - pontosPositivos
        - feedbackSupervisor
        - sugestaoEspecialista
        - followUpNecessario
        - followUpDescricao
        - riscoPerdaLead
        - tags

    ConversationDetail:
      type: object
      properties:
        id:
          type: integer
        runDate:
          type: string
        customerPhone:
          type: string
        callIds:
          type: array
          items:
            type: string
        agentId:
          type: ["string", "null"]
        agentName:
          type: ["string", "null"]
        durationSec:
          type: ["integer", "null"]
        recordingUrls:
          type: array
          items:
            type: string
        analysis:
          oneOf:
            - $ref: "#/components/schemas/ConversationAnalysis"
            - type: "null"
        costUsd:
          type: ["number", "null"]
        createdAt:
          type: string
      required:
        - id
        - runDate
        - customerPhone
        - callIds
        - agentId
        - agentName
        - durationSec
        - recordingUrls
        - analysis
        - costUsd
        - createdAt

    SummarySection:
      type: object
      description: A single section of the daily summary (working well / to improve / risks / closing-rate recs)
      properties:
        paragraph:
          type: string
          description: 1-2 sentence framing, EU-PT
        bullets:
          type: array
          items:
            type: string
          description: 3-5 specific bullets with operator names and concrete examples
      required:
        - paragraph
        - bullets

    AutomationItem:
      type: object
      properties:
        pattern:
          type: string
          description: The recurring query / interaction pattern
        conversationCountEstimate:
          type: integer
        channel:
          type: string
          description: e.g. Telefone, Email, Self-service
        feasibility:
          type: string
          enum: [alta, media, baixa]
        notes:
          type: string
      required:
        - pattern
        - conversationCountEstimate
        - channel
        - feasibility
        - notes

    AutomationOpportunities:
      type: object
      properties:
        paragraph:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/AutomationItem"
      required:
        - paragraph
        - items

    DailySummary:
      type: object
      description: Daily executive summary (canonical structure per HANDOVER §2)
      properties:
        id:
          type: integer
        date:
          type: string
        executiveSummary:
          type: string
          description: 1-2 sentence intro shown in the black banner
        workingWell:
          $ref: "#/components/schemas/SummarySection"
        toImprove:
          $ref: "#/components/schemas/SummarySection"
        risks:
          $ref: "#/components/schemas/SummarySection"
        closingRateRecommendations:
          $ref: "#/components/schemas/SummarySection"
        automationOpportunities:
          $ref: "#/components/schemas/AutomationOpportunities"
        createdAt:
          type: string
      required:
        - id
        - date
        - executiveSummary
        - workingWell
        - toImprove
        - risks
        - closingRateRecommendations
        - automationOpportunities
        - createdAt

    OperatorSummary:
      type: object
      description: Per-operator coaching summary (canonical schema per HANDOVER §2)
      properties:
        id:
          type: integer
        date:
          type: string
        operatorId:
          type: string
        operatorName:
          type: string
        paragraphOverview:
          type: string
          description: 2-3 sentence overview of the operator's day
        strengths:
          type: array
          items:
            type: string
        blindSpots:
          type: array
          items:
            type: string
        closingRateObservations:
          type: string
          description: 1-2 sentence note on closing-rate behavior
        coachingRecommendations:
          type: array
          items:
            type: string
        createdAt:
          type: string
      required:
        - id
        - date
        - operatorId
        - operatorName
        - paragraphOverview
        - strengths
        - blindSpots
        - closingRateObservations
        - coachingRecommendations
        - createdAt
