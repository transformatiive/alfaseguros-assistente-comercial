openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Alfaseguros Supervisor Virtual — daily AI analysis of phone conversations
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: runs
    description: Analysis run operations
  - name: conversations
    description: Conversation operations
  - name: summary
    description: Daily summary operations
  - name: operators
    description: Operator coaching operations
  - name: cases
    description: Cross-channel case pipeline operations
  - name: actions
    description: Daily action items aggregated from conversation analysis
  - name: auth
    description: Authentication operations
  - name: admin
    description: Admin user management

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /run:
    post:
      operationId: triggerRun
      tags: [runs]
      summary: Trigger analysis for a date
      description: Starts a new analysis run for the given date. Returns immediately; use GET /run/{date} to poll status.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TriggerRunBody"
      responses:
        "202":
          description: Run accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Run already in progress for this date
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /run/{date}:
    get:
      operationId: getRunStatus
      tags: [runs]
      summary: Get run status for a date
      description: Returns the status of the analysis run for the given date (YYYY-MM-DD).
      parameters:
        - name: date
          in: path
          required: true
          schema:
            type: string
            description: Date in YYYY-MM-DD format
      responses:
        "200":
          description: Run status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "404":
          description: No run found for this date
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /summary/{date}:
    get:
      operationId: getDailySummary
      tags: [summary]
      summary: Get daily executive summary
      description: Returns the AI-generated executive summary for the given date (YYYY-MM-DD).
      parameters:
        - name: date
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Daily summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DailySummary"
        "404":
          description: No summary found for this date
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /conversations/{date}:
    get:
      operationId: listConversations
      tags: [conversations]
      summary: List conversations for a date
      description: Returns a list of all analyzed conversations for the given date (YYYY-MM-DD).
      parameters:
        - name: date
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of conversations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ConversationSummary"
        "404":
          description: No conversations found for this date
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /conversations/{date}/{conversationId}:
    get:
      operationId: getConversation
      tags: [conversations]
      summary: Get a single conversation with full analysis
      parameters:
        - name: date
          in: path
          required: true
          schema:
            type: string
        - name: conversationId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Conversation detail with full analysis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationDetail"
        "404":
          description: Conversation not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /actions/{date}:
    get:
      operationId: listActions
      tags: [actions]
      summary: Get daily action items for a date
      description: Returns a consolidated list of action items (follow-ups, risks, deviations) extracted from all conversation analyses for the given date (YYYY-MM-DD). No LLM cost — data comes from stored analysis.
      parameters:
        - name: date
          in: path
          required: true
          schema:
            type: string
            description: Date in YYYY-MM-DD format
      responses:
        "200":
          description: List of action items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActionItem"

  /cases/{date}:
    get:
      operationId: listCases
      tags: [cases]
      summary: Get cross-channel cases for a date
      description: Returns cases that have at least one call on the given date (YYYY-MM-DD).
      parameters:
        - name: date
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of cases
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CaseSummary"

  /operators/{date}:
    get:
      operationId: listOperatorSummaries
      tags: [operators]
      summary: Get per-operator coaching summaries for a date
      parameters:
        - name: date
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of operator coaching summaries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OperatorSummary"
        "404":
          description: No operator summaries found for this date
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    TriggerRunBody:
      type: object
      properties:
        date:
          type: string
          description: Date to analyze in YYYY-MM-DD format
        force:
          type: boolean
          description: If true, re-analyze conversations that already have analysis
      required:
        - date

    Run:
      type: object
      properties:
        id:
          type: integer
        date:
          type: string
        status:
          type: string
          enum: [pending, running, completed, failed]
        totalConversations:
          type: ["integer", "null"]
        analyzedConversations:
          type: ["integer", "null"]
        totalCostUsd:
          type: ["number", "null"]
        errorMessage:
          type: ["string", "null"]
        createdAt:
          type: string
        updatedAt:
          type: string
      required:
        - id
        - date
        - status
        - totalConversations
        - analyzedConversations
        - totalCostUsd
        - errorMessage
        - createdAt
        - updatedAt

    ConversationSummary:
      type: object
      properties:
        id:
          type: integer
        runDate:
          type: string
        customerPhone:
          type: string
        callCount:
          type: integer
        agentId:
          type: ["string", "null"]
        agentName:
          type: ["string", "null"]
        durationSec:
          type: ["integer", "null"]
        isMultiLeg:
          type: boolean
        hasAnalysis:
          type: boolean
        # Analysis-derived fields surfaced to the list view (null when no analysis yet)
        categoria:
          type: ["string", "null"]
        produto:
          type: ["string", "null"]
        qualidadeGlobal:
          type: ["integer", "null"]
        riscoPerdaLead:
          type: ["string", "null"]
          enum: [baixo, medio, alto, null]
        desviosCount:
          type: integer
        followUpNecessario:
          type: boolean
        deskTicketCount:
          type: integer
          description: Number of Zoho Desk tickets associated with this customer phone. 0 means phone-only.
        startTime:
          type: ["string", "null"]
        costUsd:
          type: ["number", "null"]
        createdAt:
          type: string
      required:
        - id
        - runDate
        - customerPhone
        - callCount
        - agentId
        - agentName
        - durationSec
        - isMultiLeg
        - hasAnalysis
        - categoria
        - produto
        - qualidadeGlobal
        - riscoPerdaLead
        - desviosCount
        - followUpNecessario
        - deskTicketCount
        - startTime
        - costUsd
        - createdAt

    DesvioProcedimento:
      type: object
      description: A specific deviation from expected procedure observed in the conversation.
      properties:
        severidade:
          type: string
          enum: [alta, media, baixa]
        titulo:
          type: string
          description: Short label, e.g. "Sem confirmação de identidade"
        detalhe:
          type: string
          description: Concrete description of what was missed and why it matters
        chamadaEspecifica:
          type: ["string", "null"]
          description: Reference to a specific leg/time, e.g. "16:06 (chamada 1)"
      required:
        - severidade
        - titulo
        - detalhe
        - chamadaEspecifica

    ConversationAnalysis:
      type: object
      description: Per-conversation analysis (canonical schema — EU-PT field names per HANDOVER §2)
      properties:
        categoria:
          type: string
          description: e.g. Cotação, Renovação, Sinistro, Informação, Pós-venda
        produto:
          type: string
          description: e.g. TVDE, Multirriscos, Auto, Saúde, Condomínio, Empresas
        narrativaConversa:
          type: string
          description: End-to-end story of the customer's request across all legs
        arcoConversa:
          type: string
          description: Short phrase describing the arc, e.g. "Frio→Quente", "Estagnado", "Direto ao Fecho", "Esfriou"
        sentimentoClienteEvolucao:
          type: string
          description: Evolution of customer sentiment across legs (rendered in italic)
        qualidadeGlobal:
          type: integer
          minimum: 1
          maximum: 5
          description: Overall quality stars (1-5)
        continuidade:
          type: string
          description: Continuity assessment — empty if single-leg, warning text if handoffs failed
        desviosProcedimento:
          type: array
          items:
            $ref: "#/components/schemas/DesvioProcedimento"
        pontosPositivos:
          type: array
          items:
            type: string
        feedbackSupervisor:
          type: string
          description: Coaching message addressed to the operator by name (EU-PT, coaching tone)
        sugestaoEspecialista:
          type: string
          description: Cross-sell / product-expertise suggestion
        followUpNecessario:
          type: boolean
        followUpDescricao:
          type: string
          description: What to do and by when (empty when followUpNecessario is false)
        riscoPerdaLead:
          type: string
          enum: [baixo, medio, alto]
        tags:
          type: array
          items:
            type: string
      required:
        - categoria
        - produto
        - narrativaConversa
        - arcoConversa
        - sentimentoClienteEvolucao
        - qualidadeGlobal
        - continuidade
        - desviosProcedimento
        - pontosPositivos
        - feedbackSupervisor
        - sugestaoEspecialista
        - followUpNecessario
        - followUpDescricao
        - riscoPerdaLead
        - tags

    DeskTicketComment:
      type: object
      description: A comment on a Zoho Desk ticket.
      properties:
        id:
          type: string
        commentedTime:
          type: ["string", "null"]
        channel:
          type: ["string", "null"]
        authorType:
          type: ["string", "null"]
          description: AGENT | END_USER | SYSTEM
        authorName:
          type: ["string", "null"]
        content:
          type: string
      required:
        - id
        - commentedTime
        - channel
        - authorType
        - authorName
        - content

    DeskTicket:
      type: object
      description: A Zoho Desk ticket matched to this conversation via phone fingerprint.
      properties:
        id:
          type: string
        ticketNumber:
          type: ["string", "null"]
        subject:
          type: ["string", "null"]
        status:
          type: ["string", "null"]
        category:
          type: ["string", "null"]
        productName:
          type: ["string", "null"]
        contactName:
          type: ["string", "null"]
        assigneeName:
          type: ["string", "null"]
        outcomeStatus:
          type: ["string", "null"]
        createdTime:
          type: ["string", "null"]
        modifiedTime:
          type: ["string", "null"]
        comments:
          type: array
          items:
            $ref: "#/components/schemas/DeskTicketComment"
          description: Comments on this ticket, sorted chronologically
      required:
        - id
        - ticketNumber
        - subject
        - status
        - category
        - productName
        - contactName
        - assigneeName
        - outcomeStatus
        - createdTime
        - modifiedTime
        - comments

    ConversationLeg:
      type: object
      description: A single call leg within a grouped conversation.
      properties:
        callId:
          type: string
        agentName:
          type: ["string", "null"]
        direction:
          type: ["string", "null"]
          description: inbound | outbound
        startTime:
          type: ["string", "null"]
        durationSec:
          type: integer
        ringoverSummary:
          type: string
          description: AI-generated or manual note from Ringover
      required:
        - callId
        - agentName
        - direction
        - startTime
        - durationSec
        - ringoverSummary

    ConversationDetail:
      type: object
      properties:
        id:
          type: integer
        runDate:
          type: string
        customerPhone:
          type: string
        callIds:
          type: array
          items:
            type: string
        agentId:
          type: ["string", "null"]
        agentName:
          type: ["string", "null"]
        durationSec:
          type: ["integer", "null"]
        recordingUrls:
          type: array
          items:
            type: string
        analysis:
          oneOf:
            - $ref: "#/components/schemas/ConversationAnalysis"
            - type: "null"
        legs:
          type: array
          items:
            $ref: "#/components/schemas/ConversationLeg"
          description: Individual call legs in chronological order (empty for older records)
        tickets:
          type: array
          items:
            $ref: "#/components/schemas/DeskTicket"
          description: Zoho Desk tickets matched via phone fingerprint (with comments)
        costUsd:
          type: ["number", "null"]
        createdAt:
          type: string
      required:
        - id
        - runDate
        - customerPhone
        - callIds
        - agentId
        - agentName
        - durationSec
        - recordingUrls
        - analysis
        - legs
        - tickets
        - costUsd
        - createdAt

    SummarySection:
      type: object
      description: A single section of the daily summary (working well / to improve / risks / closing-rate recs)
      properties:
        paragraph:
          type: string
          description: 1-2 sentence framing, EU-PT
        bullets:
          type: array
          items:
            type: string
          description: 3-5 specific bullets with operator names and concrete examples
      required:
        - paragraph
        - bullets

    AutomationItem:
      type: object
      properties:
        pattern:
          type: string
          description: The recurring query / interaction pattern
        conversationCountEstimate:
          type: integer
        channel:
          type: string
          description: e.g. Telefone, Email, Self-service
        feasibility:
          type: string
          enum: [alta, media, baixa]
        notes:
          type: string
      required:
        - pattern
        - conversationCountEstimate
        - channel
        - feasibility
        - notes

    AutomationOpportunities:
      type: object
      properties:
        paragraph:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/AutomationItem"
      required:
        - paragraph
        - items

    DailySummary:
      type: object
      description: Daily executive summary (canonical structure per HANDOVER §2)
      properties:
        id:
          type: integer
        date:
          type: string
        executiveSummary:
          type: string
          description: 1-2 sentence intro shown in the black banner
        workingWell:
          $ref: "#/components/schemas/SummarySection"
        toImprove:
          $ref: "#/components/schemas/SummarySection"
        risks:
          $ref: "#/components/schemas/SummarySection"
        closingRateRecommendations:
          $ref: "#/components/schemas/SummarySection"
        automationOpportunities:
          $ref: "#/components/schemas/AutomationOpportunities"
        createdAt:
          type: string
      required:
        - id
        - date
        - executiveSummary
        - workingWell
        - toImprove
        - risks
        - closingRateRecommendations
        - automationOpportunities
        - createdAt

    OperatorSummary:
      type: object
      description: Per-operator coaching summary (canonical schema per HANDOVER §2)
      properties:
        id:
          type: integer
        date:
          type: string
        operatorId:
          type: string
        operatorName:
          type: string
        paragraphOverview:
          type: string
          description: 2-3 sentence overview of the operator's day
        strengths:
          type: array
          items:
            type: string
        blindSpots:
          type: array
          items:
            type: string
        closingRateObservations:
          type: string
          description: 1-2 sentence note on closing-rate behavior
        coachingRecommendations:
          type: array
          items:
            type: string
        conversationIds:
          type: array
          items:
            type: integer
          description: DB ids of all conversations analysed for this operator on this date
        createdAt:
          type: string
      required:
        - id
        - date
        - operatorId
        - operatorName
        - paragraphOverview
        - strengths
        - blindSpots
        - closingRateObservations
        - coachingRecommendations
        - conversationIds
        - createdAt

    ActionItem:
      type: object
      description: A single action item extracted from conversation analysis (follow-up, risk, or deviation).
      properties:
        id:
          type: string
          description: Unique id (e.g. "42-follow_up")
        tipo:
          type: string
          enum: [follow_up_pendente, risco_perda_lead, desvio_procedimento, qualidade_critica, oportunidade_cross_sell, cotacao_sem_seguimento, lead_quente_sem_fecho]
        prioridade:
          type: string
          enum: [alta, media, baixa]
        titulo:
          type: string
        descricao:
          type: string
        conversationId:
          type: integer
        agentName:
          type: ["string", "null"]
        customerPhone:
          type: string
        contactName:
          type: ["string", "null"]
          description: Contact name from Zoho Desk, if known.
        runDate:
          type: string
      required:
        - id
        - tipo
        - prioridade
        - titulo
        - descricao
        - conversationId
        - agentName
        - customerPhone
        - contactName
        - runDate

    CaseLeg:
      type: object
      description: A single event in a cross-channel case timeline.
      properties:
        kind:
          type: string
          enum: [call, ticket_event, ticket_comment]
        at:
          type: string
          description: ISO 8601 timestamp
        refId:
          type: string
          description: ticket id, comment id, or conversation row id
        label:
          type: string
        detail:
          type: string
        agentName:
          type: ["string", "null"]
        channel:
          type: ["string", "null"]
        conversationId:
          type: ["integer", "null"]
          description: For call legs, the linked conversation DB id
      required:
        - kind
        - at
        - refId
        - label
        - detail
        - agentName
        - channel
        - conversationId

    CaseSummary:
      type: object
      description: A cross-channel case (calls + tickets) linked to a date.
      properties:
        id:
          type: string
        customerPhone:
          type: ["string", "null"]
        customerName:
          type: ["string", "null"]
        productName:
          type: ["string", "null"]
        primaryAgentName:
          type: ["string", "null"]
        firstActivityAt:
          type: ["string", "null"]
        lastActivityAt:
          type: ["string", "null"]
        outcomeStatus:
          type: string
          description: won | lost | open | unknown
        legCount:
          type: integer
        conversationIds:
          type: array
          items:
            type: integer
          description: Conversation DB ids linked to this case
        ticketIds:
          type: array
          items:
            type: string
        timeline:
          type: array
          items:
            $ref: "#/components/schemas/CaseLeg"
        analysis:
          oneOf:
            - $ref: "#/components/schemas/ConversationAnalysis"
            - type: "null"
        costUsd:
          type: ["number", "null"]
      required:
        - id
        - customerPhone
        - customerName
        - productName
        - primaryAgentName
        - firstActivityAt
        - lastActivityAt
        - outcomeStatus
        - legCount
        - conversationIds
        - ticketIds
        - timeline
        - analysis
        - costUsd
