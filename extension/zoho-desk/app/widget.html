<!DOCTYPE html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>O meu painel</title>
    <style>
      :root {
        --fg: #0f172a;
        --muted: #64748b;
        --linha: #e2e8f0;
        --accent: #f59e0b;
        --perigo: #dc2626;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        font: 14px/1.45 Inter, -apple-system, "Segoe UI", sans-serif;
        color: var(--fg);
        background: #fff;
        overflow: hidden;
      }
      /* The panel fills the band. No chrome of our own around it: anything we
         drew here would be a second header above the panel's own. */
      #quadro {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
      }
      .aviso {
        padding: 12px 16px;
        font-size: 13px;
        line-height: 1.6;
        color: var(--muted);
        border-bottom: 1px solid var(--linha);
      }
      .aviso b { color: var(--fg); }
      code {
        font: 12px/1.4 Menlo, monospace;
        background: #f1f5f9;
        padding: 1px 4px;
        border-radius: 3px;
      }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <iframe id="quadro" title="O meu painel" hidden></iframe>
    <div class="aviso" id="aviso" hidden></div>

    <script src="https://js.zohostatic.com/support/developer_sdk/v1/js/ZohoDeskClientSDK.min.js"></script>
    <script>
      /*
       * The Desk host for the panel.
       *
       * It turns "this browser has a logged-in Desk agent" into "this browser
       * has a 15-minute panel token", puts the panel on screen inside Desk,
       * and then keeps that token alive. It used to be a launcher — a thin
       * band with a button that opened the panel in another tab — and the
       * button and the second tab are both gone.
       *
       * Three things here are deliberate and easy to undo by accident:
       *
       *  1. **The token is minted before the frame is drawn**, never after.
       *     An iframe pointed at a dead token renders a blank page with no
       *     explanation, and blank is indistinguishable from a broken portal.
       *     Minting first means every failure has somewhere to be said.
       *
       *  2. **Renewal is driven by the panel, not by a clock.** The panel
       *     posts `painel-agente:token-expirado` when the API rejects its
       *     token; this listens and swaps the frame. A timer alone would
       *     reload the page under the agent's hands while the token was still
       *     good. The timer that does exist only fires while the tab is
       *     hidden — see `agendarRenovacao`.
       *
       *  3. **Every failure says something.** A host that silently shows
       *     nothing is the worst outcome: the agent cannot tell whether the
       *     panel is empty, broken, or still loading. Each failure names what
       *     to do next.
       */

      var el = {
        quadro: document.getElementById("quadro"),
        aviso: document.getElementById("aviso"),
      };

      function mostrarAviso(html) {
        el.aviso.innerHTML = html;
        el.aviso.hidden = false;
      }

      /*
       * Pull an identity out of whatever ZOHODESK.get("user") returns.
       *
       * The response envelope is NOT documented in the public extension guide —
       * different SDK versions have wrapped it as `{user: {...}}`, as
       * `{user: {value: {...}}}`, and as the bare object. Rather than pick one
       * and be confidently wrong in production, this accepts any of them and,
       * when it finds nothing, shows what it actually received so the next
       * person can fix it in one look instead of guessing.
       */
      function extrairUtilizador(resposta) {
        var candidatos = [
          resposta,
          resposta && resposta.user,
          resposta && resposta.user && resposta.user.value,
          resposta && resposta.value,
        ];
        for (var i = 0; i < candidatos.length; i++) {
          var c = candidatos[i];
          if (c && (c.email || c.id || c.emailId)) {
            return {
              id: c.id ? String(c.id) : null,
              email: c.email || c.emailId || null,
              nome: c.fullName || c.name || null,
            };
          }
        }
        return null;
      }

      function extrairPortal(resposta) {
        var candidatos = [
          resposta,
          resposta && resposta.portal,
          resposta && resposta.portal && resposta.portal.value,
          resposta && resposta.value,
        ];
        for (var i = 0; i < candidatos.length; i++) {
          var c = candidatos[i];
          if (c && c.id) return String(c.id);
        }
        return null;
      }

      /*
       * The base URL, which is not really configurable and never was.
       *
       * It is pinned twice in the manifest already — `whiteListedDomains` and
       * `cspDomains.connect-src` — so a different value in the config field
       * would be blocked by the browser before it reached anything. Keeping it
       * as a parameter offered an flexibility that does not exist, and made a
       * working panel depend on reading a response shape Zoho does not
       * document. The field stays for now (removing it would orphan the value
       * already saved in the portal), but it is no longer load-bearing: it can
       * only override the default with the same origin the manifest allows.
       */
      var BASE_POR_OMISSAO = "https://supervisor-production-f030.up.railway.app";

      /*
       * Find the config values anywhere in whatever ZOHODESK hands back.
       *
       * Desk returns them as an array of pairs under one key:
       *
       *   {"extension.config": [
       *     {"name": "agenteAppUrl", "value": "https://…", "defaultValue": null},
       *     {"name": "widgetToken",  "value": "…",         "defaultValue": null}
       *   ]}
       *
       * Confirmed against the real portal. It is not in Zoho's extension guide
       * — `global-methods.html` documents User, Portal, Department and Current
       * Call, and nothing else — so it was found by printing what arrived.
       *
       * Two readings, in one pass, because the first version of this made the
       * mistake of assuming one:
       *
       *  1. **Pairs.** An object carrying a `name` that matches one of ours
       *     contributes `name → value`, falling back to `defaultValue`, which
       *     is what that field is for.
       *
       *  2. **Direct keys.** An object carrying `agenteAppUrl` or
       *     `widgetToken` as its own key contributes them as they are.
       *
       * The second is the safety net. Keeping it costs a comparison per node
       * and covers a future SDK that flattens the array — which is exactly the
       * kind of change that would otherwise break the band silently.
       *
       * Bounded on purpose: a depth limit and a node budget mean a surprising
       * response costs microseconds instead of hanging the band, and `seen`
       * makes a cyclic object terminate rather than spin.
       */
      function procurarValores(raiz, nomes) {
        var encontrado = {};
        var porEncontrar = nomes.length;
        var seen = [];
        var fila = [{ no: raiz, profundidade: 0 }];
        var visitados = 0;

        function registar(nome, valor) {
          if (encontrado[nome] === undefined && typeof valor === "string" && valor) {
            encontrado[nome] = valor;
            porEncontrar--;
          }
        }

        while (fila.length > 0 && visitados < 800) {
          var item = fila.shift();
          var no = item.no;
          visitados++;
          if (!no || typeof no !== "object" || item.profundidade > 6) continue;
          if (seen.indexOf(no) !== -1) continue;
          seen.push(no);

          // 1. the pair shape
          if (typeof no.name === "string") {
            for (var p = 0; p < nomes.length; p++) {
              if (no.name === nomes[p]) registar(nomes[p], no.value || no.defaultValue);
            }
          }
          // 2. the direct-key shape
          for (var k = 0; k < nomes.length; k++) registar(nomes[k], no[nomes[k]]);

          if (porEncontrar === 0) return encontrado;

          for (var chave in no) {
            if (Object.prototype.hasOwnProperty.call(no, chave)) {
              fila.push({ no: no[chave], profundidade: item.profundidade + 1 });
            }
          }
        }
        return encontrado;
      }

      function extrairConfig(resposta) {
        var achado = procurarValores(resposta, ["agenteAppUrl", "widgetToken"]);
        // Only the token is genuinely required: without it nothing can be
        // minted. The URL has a default that the manifest pins anyway.
        if (!achado.widgetToken) return null;
        return {
          agenteAppUrl: achado.agenteAppUrl || BASE_POR_OMISSAO,
          widgetToken: achado.widgetToken,
        };
      }

      /*
       * What the config response actually looked like, for the failure notice.
       *
       * Printed because the alternative is another publish cycle spent finding
       * out — and a publish cycle here is a pack, a new Sigma version, and an
       * update to the installed extension. The token is redacted: this notice
       * is rendered inside the Desk band, where anyone walking past the agent's
       * screen can read it.
       */
      function formaDaConfig(resposta) {
        var texto;
        try {
          texto = JSON.stringify(resposta);
        } catch (e) {
          texto = String(resposta);
        }
        if (!texto) return "(vazio)";
        // Any long opaque run is assumed to be the token.
        texto = texto.replace(/[A-Za-z0-9_\-]{20,}/g, "«valor»");
        return texto.slice(0, 400);
      }

      /** Mint a panel token for this agent. Resolves to the JSON body. */
      function pedirToken(cfg, utilizador, portalId) {
        return fetch(cfg.base + "/api/agente/sessao", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "X-Painel-Widget-Token": cfg.token,
          },
          body: JSON.stringify({
            deskUserId: utilizador.id,
            email: utilizador.email,
            portalId: portalId,
            source: "desk",
          }),
        }).then(function (res) {
          if (res.status === 403) {
            var err = new Error("nao-reconhecido");
            err.naoReconhecido = true;
            throw err;
          }
          if (!res.ok) throw new Error("O servidor respondeu " + res.status);
          return res.json();
        });
      }

      /*
       * Put the panel on screen with a freshly minted token.
       *
       * The token travels in the fragment: browsers never send a fragment to a
       * server and never write it to an access log. The panel reads it once and
       * erases it from its own address bar.
       *
       * Swapping `src` is a full reload of the panel, which is the point — it is
       * the only way to hand a new token to an app that keeps it in memory and
       * nowhere else.
       */
      function desenharPainel(cfg, token) {
        el.quadro.src = cfg.base + "/agente#token=" + encodeURIComponent(token);
        el.quadro.hidden = false;
        el.aviso.hidden = true;
      }

      /*
       * Ask Desk for the whole height.
       *
       * `desk.topband` is full-screen, but the frame Desk gives an extension is
       * sized by Desk, not by its content, and a panel in a 200px slot is not a
       * panel. RESIZE is documented with px/%/vh/vw units. It is wrapped because
       * an SDK that does not know this verb must not cost us the panel: a
       * badly-sized panel is still a panel, an exception here would be a blank
       * one.
       */
      function ocuparEcra() {
        try {
          ZOHODESK.invoke("RESIZE", { height: "100vh", width: "100%" });
        } catch (e) {
          /* a smaller panel is still a panel */
        }
      }

      window.onload = function () {
        if (typeof ZOHODESK === "undefined") {
          mostrarAviso(
            "Não foi possível carregar o SDK do Zoho Desk. Recarrega a página; " +
              "se continuar, avisa o Nuno."
          );
          return;
        }

        ZOHODESK.extension.onload().then(function () {
          return Promise.all([
            ZOHODESK.get("user"),
            ZOHODESK.get("portal"),
            ZOHODESK.get("extension.config"),
          ]).then(function (respostas) {
            var utilizador = extrairUtilizador(respostas[0]);
            var portalId = extrairPortal(respostas[1]);
            var config = extrairConfig(respostas[2]);

            if (!config) {
              mostrarAviso(
                "A extensão está instalada mas não consegui ler o <b>Token do " +
                  "widget</b>. Se o campo está preenchido nas definições, isto " +
                  "é um problema nosso e não teu — mostra ao Nuno o que o Desk " +
                  "devolveu: <code>" +
                  formaDaConfig(respostas[2]) +
                  "</code>"
              );
              return;
            }

            var cfg = {
              base: String(config.agenteAppUrl).replace(/\/+$/, ""),
              token: config.widgetToken,
            };

            if (!utilizador) {
              mostrarAviso(
                "Não consegui identificar-te a partir do Zoho Desk. Mostra isto " +
                  "ao Nuno: <code>" +
                  JSON.stringify(respostas[0]).slice(0, 300) +
                  "</code>"
              );
              return;
            }

            // One renewal at a time. The panel can post the same complaint from
            // several requests failing together; without this each one would
            // mint a token and reload the frame on top of the last.
            var aRenovar = false;

            function renovar() {
              if (aRenovar) return;
              aRenovar = true;
              pedirToken(cfg, utilizador, portalId)
                .then(function (sessao) {
                  aRenovar = false;
                  desenharPainel(cfg, sessao.token);
                })
                .catch(function (erro) {
                  aRenovar = false;
                  falhou(erro);
                });
            }

            function falhou(erro) {
              el.quadro.hidden = true;
              if (erro && erro.naoReconhecido) {
                mostrarAviso(
                  "A tua conta do Zoho Desk (<b>" +
                    (utilizador.email || utilizador.id) +
                    "</b>) ainda não está ligada ao painel. Fala com o Nuno " +
                    "para ficares ligado — é uma linha de configuração, não " +
                    "demora."
                );
                return;
              }
              mostrarAviso(
                "Não foi possível abrir o painel. Recarrega a página; se " +
                  "continuar, avisa o Nuno. <code>" +
                  String(erro && erro.message ? erro.message : erro).slice(0, 200) +
                  "</code>"
              );
            }

            /*
             * The panel asks; we answer. `sessao.ts` posts this message the
             * moment the API rejects its token, which is the only moment that
             * actually needs a new one.
             *
             * The origin check is the whole security of this listener: anything
             * on the page can post a message, and acting on one from elsewhere
             * would let a third party make us mint tokens at will.
             */
            window.addEventListener("message", function (evento) {
              if (evento.origin !== cfg.base) return;
              var dados = evento.data;
              if (!dados || dados.tipo !== "painel-agente:token-expirado") return;
              renovar();
            });

            /*
             * The clock, kept only for the case the message cannot cover: a tab
             * left open and hidden, where the panel makes no requests, notices
             * nothing, and would come back dead. A visible tab is left alone —
             * reloading the panel under the agent's hands while their token is
             * still good is worse than the wait for the next 401.
             */
            var ANTES_DE_EXPIRAR_MS = 13 * 60 * 1000;
            setInterval(function () {
              if (document.hidden) renovar();
            }, ANTES_DE_EXPIRAR_MS);

            // Mint first, draw second: an iframe pointed at a dead token is a
            // blank page, and blank is indistinguishable from a broken portal.
            pedirToken(cfg, utilizador, portalId)
              .then(function (sessao) {
                desenharPainel(cfg, sessao.token);
                ocuparEcra();
              })
              .catch(falhou);
          });
        }).catch(function (erro) {
          mostrarAviso(
            "A extensão não arrancou. Mostra isto ao Nuno: <code>" +
              String(erro && erro.message ? erro.message : erro).slice(0, 200) +
              "</code>"
          );
        });
      };
    </script>
  </body>
</html>
